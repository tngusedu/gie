<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구과제 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 왼쪽에 묶음별 도구 목록(누르면 새 창으로 연결), 오른쪽에 과제 목록 또는 과제 방. 연구기간 일정표는 관리자 화면에만 그린다. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --soft:#e4ebea; --ink:#15242a; --muted:#5a696e; --line:#d6dedc;
  --accent:#0b5f73; --accent-ink:#ffffff;
  --ok:#2c7a4b; --warn:#a86200; --crit:#b3372f;
  --t1:#0b5f73; --t2:#84479a; --t3:#b3581e; --t4:#3f6f2c; --t5:#3b55a6; --tile-ink:#ffffff;
  --display:"Hahmlet","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f181b; --surface:#172329; --soft:#1d2c32; --ink:#e4eded; --muted:#98a9ae; --line:#2b3b42;
    --accent:#5fc1d6; --accent-ink:#06222a;
    --ok:#6cc08c; --warn:#e0a84a; --crit:#ee7d74;
    --t1:#4fb3c9; --t2:#c18bd1; --t3:#e09a5e; --t4:#86c06f; --t5:#8ea4f0; --tile-ink:#0c1518;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f181b; --surface:#172329; --soft:#1d2c32; --ink:#e4eded; --muted:#98a9ae; --line:#2b3b42;
  --accent:#5fc1d6; --accent-ink:#06222a;
  --ok:#6cc08c; --warn:#e0a84a; --crit:#ee7d74;
  --t1:#4fb3c9; --t2:#c18bd1; --t3:#e09a5e; --t4:#86c06f; --t5:#8ea4f0; --tile-ink:#0c1518;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:26px} h2{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:13px;padding-bottom:13px}
.brand{font-family:var(--display);font-weight:600;font-size:18px;color:var(--ink);text-decoration:none}
.who{color:var(--muted);font-size:13px}
main{padding:24px 0 64px}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent);padding:3px 6px}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.55;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live{color:var(--ok)} .pill.soon{color:var(--warn)} .pill.done,.pill.tbd{color:var(--muted)}
.chip{display:inline-block;border-radius:5px;padding:1px 8px;font-size:12.5px;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.type{color:var(--tile-ink);background:var(--c,var(--accent))}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);border-radius:8px;padding:12px 16px}
.only{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:1px 10px;white-space:nowrap}

/* 왼쪽 도구 목록 */
.side{background:var(--soft);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.side-title{font-family:var(--display);font-weight:600;font-size:16px;padding:4px 8px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.side details{border-bottom:1px solid var(--line);padding:6px 0}
.side details:last-of-type{border-bottom:0}
.side summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;padding:6px 8px;border-radius:6px}
.tool{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;text-decoration:none;color:var(--ink);min-width:0}
a.tool:hover{background:var(--surface)}
.tool .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.tile{flex:0 0 28px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--c,var(--accent));color:var(--tile-ink);font-size:13px;font-weight:600}
.toolrow{display:flex;align-items:center}
.toolrow .tool{flex:1}

/* 오늘 날짜 */
.daycard{display:grid;grid-template-columns:96px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.daycard .mon{background:var(--crit);color:#fff;font-weight:600;font-size:13px;padding:3px 0}
.daycard .dd{font-size:40px;font-weight:600;line-height:1.25}
.daycard .info{padding:16px 20px;display:flex;flex-direction:column;justify-content:center;gap:2px}

/* 과제 목록 */
.plist{display:flex;flex-direction:column}
.pitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:13px 4px;cursor:pointer;color:var(--ink);text-decoration:none}
.pitem:last-child{border-bottom:0}
.pitem:hover .ptitle{color:var(--accent);text-decoration:underline}
.ptitle{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.lock{font-size:12.5px;color:var(--muted);white-space:nowrap}
.lock.open{color:var(--ok);font-weight:600}

/* 연간 일정표 (관리자) */
.yearnav{display:flex;align-items:center;gap:8px}
.yearnav strong{font-family:var(--display);font-size:18px;min-width:70px;text-align:center}
.tl{--label:230px;display:flex;flex-direction:column}
.tl-head,.tl-row{display:grid;grid-template-columns:var(--label) 1fr;gap:16px;align-items:center}
.months{display:grid;grid-template-columns:repeat(12,1fr);font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.months span{padding-left:3px}
.tl-row{text-decoration:none;color:inherit;border-bottom:1px solid var(--line);padding:4px 0}
.tl-row:last-child{border-bottom:0}
.tl-row:hover .tl-title{color:var(--accent);text-decoration:underline}
.tl-label{padding:8px 0;min-width:0}
.tl-title{font-weight:600;overflow-wrap:anywhere}
.track{position:relative;height:52px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / 12) 100%}
.bar{position:absolute;top:15px;height:22px;border-radius:6px;background:var(--c,var(--accent));min-width:4px}
.bar.cutL{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cutR{border-top-right-radius:0;border-bottom-right-radius:0}
.ms{position:absolute;top:20px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:var(--surface);border:2px solid var(--ink);z-index:1}
.ms.done{background:var(--ink)}
.todayline{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--crit);z-index:2}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.legend .lg-ms{width:10px;height:10px;transform:rotate(45deg);border:2px solid var(--ink)}
.legend .lg-today{width:2px;height:14px;background:var(--crit)}
.legend .lg-bar{width:22px;height:10px;border-radius:3px;background:var(--c)}

/* 과제 방 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card .tile{flex-basis:36px;width:36px;height:36px;border-radius:10px;font-size:15px}
.card b{display:block;font-weight:600;overflow-wrap:anywhere}
.card .host{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.notice{white-space:pre-wrap;max-width:65ch;margin:0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .when{flex:0 0 92px;color:var(--muted);font-size:13px}
.tick{font-size:12.5px;color:var(--ok);font-weight:600}

/* 대화상자 */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(660px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog.narrow{width:min(400px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(8,16,20,.55)}
.dlg{display:flex;flex-direction:column;gap:16px;padding:22px}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=url],input[type=date],input[type=password],select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--bg);width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
.subrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.subrow input[type=text]{flex:1;min-width:100px}
.subrow input[type=url]{flex:2;min-width:160px}
.subrow input[type=date]{flex:0 0 150px;width:150px}
.help{font-size:13px;color:var(--muted);background:var(--soft);border-radius:7px;padding:9px 12px}
.err{color:var(--crit);font-size:13.5px;font-weight:500}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100vw - 32px);z-index:50}
#toast[hidden]{display:none}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .shell > .side{order:2}
  .tl-head{display:none}
  .tl-row{grid-template-columns:1fr;gap:0;padding:10px 0}
  .tl-label{padding:0 0 2px}
  .track{height:40px}.bar{top:9px}.ms{top:14px}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;font-weight:500;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start}
.daycard .calbox{border-right:1px solid var(--line);text-align:center;padding-bottom:10px}
.list .when.wide{flex-basis:118px}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:630px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dow{font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.sun{color:var(--crit)}
.cell{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.off{background:var(--bg)}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.dnum{font-size:13px;font-weight:600}
.dnum.sun{color:var(--crit)}
.addday{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:5px;width:22px;height:22px;line-height:1;font-size:16px}
.addday:hover{background:var(--soft);color:var(--accent)}
.cev{display:block;width:100%;text-align:left;border:0;border-radius:5px;padding:2px 6px;font-size:12px;line-height:1.45;background:var(--accent);color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.cev{cursor:pointer}
.cev.ms2{background:var(--soft);color:var(--ink)}
.cev.mark{background:transparent;color:var(--muted);border:1px dashed var(--line)}
input[type=time]{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--bg);width:100%;min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 11px;cursor:pointer;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list li.todo{align-items:center;gap:10px}
.todo input[type=checkbox]{flex:0 0 18px;width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.todo input[disabled]{cursor:default}
.ttitle{font-weight:600;overflow-wrap:anywhere}
.todo.done .ttitle{font-weight:400;text-decoration:line-through;color:var(--muted)}
.due{font-size:13px;white-space:nowrap;color:var(--muted)}
.due.late,.gname.late{color:var(--crit);font-weight:600}
.gname{font-size:13px;font-weight:600;color:var(--muted);padding-top:6px}
.kind{flex:0 0 auto;font-size:12px;font-weight:600;border-radius:5px;padding:1px 7px;border:1px solid currentColor}
.k-ms{color:var(--warn)} .k-td{color:var(--accent)} .k-ev{color:var(--ok)}
.cev.td2{background:transparent;color:var(--ink);border:1px solid var(--line)}
.cev.td2.done{color:var(--muted);text-decoration:line-through}
a.pitem{text-decoration:none}
@media (max-width:820px){.list li.todo{flex-wrap:wrap}.due{flex-basis:100%;padding-left:28px}}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{padding:5px 10px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a[aria-current="page"]{color:var(--ink);background:var(--soft)}
.cev.pj{background:var(--c);color:var(--tile-ink)}
.cev.gc{background:transparent;color:var(--ink);border:1px solid var(--ink);text-decoration:none}
.gcbar{background:transparent;border:1px solid var(--ink)}
.k-g{color:var(--ink)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.sval{font-size:24px;font-weight:600;line-height:1.4}
.wtable{width:100%;min-width:860px;border-collapse:collapse;font-size:14px}
.wtable th{background:var(--soft);font-size:12.5px;color:var(--muted);padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.wtable td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
.wtable tr:last-child td{border-bottom:0}
.wtable th:first-child,.wtable td.wdate{text-align:left;padding-left:16px;font-weight:600;white-space:nowrap}
.wtable tr.is-sat td.wdate{color:var(--accent)}
.wtable tr.is-hol{background:color-mix(in srgb,var(--crit) 9%,transparent)}
.wtable tr.is-vac{background:color-mix(in srgb,var(--ok) 9%,transparent)}
.wtable input[type=text].tin,.wtable input[type=number].tin{width:78px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--bg);font-variant-numeric:tabular-nums}
.wtable input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.tsel{border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--bg);width:auto}
.wtable :disabled{opacity:.4}
.wres{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ok)}
.wres.zero{color:var(--muted);font-weight:400}.wres.hol{color:var(--warn)}.wres.vac{color:var(--accent)}.wres.short{color:var(--crit)}
input[type=month]{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--bg);width:100%}
.tabs button{padding:8px 14px;border:0;background:transparent;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:500;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs b.late{color:var(--crit)}
.nrow{padding:11px 4px}
.cal.compact .cell{min-height:78px}
.wstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 20px}
.wstat{border-left:3px solid var(--line);padding-left:12px}
.tile.has-img{background:#fff;border:1px solid var(--line);padding:3px}
.tile img{width:100%;height:100%;object-fit:contain;display:block;border-radius:4px}
.wrap{max-width:1500px}
.shell3{grid-template-columns:250px minmax(0,1fr) minmax(320px,400px)}
.rcol .tl-head{grid-template-columns:1fr}
.rcol .tl-head > div:first-child{display:none}
.rcol .months{font-size:11px}
.rcol .tl-row{grid-template-columns:1fr;gap:0;padding:10px 0}
.rcol .tl-label{padding:0 0 2px}
.rcol .track{height:40px}.rcol .bar{top:9px}.rcol .ms{top:14px}
.rcol .list li.todo{flex-wrap:wrap}
.rcol .due{flex:1 1 60%;padding-left:28px;white-space:normal}
.rcol .tabs button{padding:8px 10px}
@media (max-width:1240px){.shell3{grid-template-columns:250px minmax(0,1fr)}.shell3 > .rcol{grid-column:2}}
@media (max-width:820px){.shell3{grid-template-columns:1fr}.shell3 > .rcol{grid-column:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">연구과제 관리</a>
    <div class="hdr" id="hdr"></div>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<dialog id="dlg"></dialog>
<dialog id="cfm" class="narrow"></dialog>
<div id="toast" role="status" hidden></div>

<script type="module">
import { firebaseConfig, ADMIN_EMAILS } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, reauthenticateWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, query, where, onSnapshot, setDoc, getDoc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

/* ---------- 상태 ---------- */
const S = {
  configured: false, authReady: false, user: null, isAdmin: false,
  projects: [], todos: {}, events: {}, links: [], types: null,
  loaded: { projects: false, links: false }, denied: false, redirected: false,
  year: null, cal: null, acal: null, filter: "전체", workMounted: false, workFlush: null, tabMine: "up", tabReq: "up", work: null, workState: "loading",
};

/* ---------- 도우미 ---------- */
const D = s => { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const days = (a, b) => Math.round((b - a) / 864e5);
const fmt = s => { const d = D(s); return d ? `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}` : "미정"; };
const fmtDay = s => { const d = D(s); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})` : ""; };
const period = p => `${fmt(p.start)} ~ ${fmt(p.end)}`;
const timeOf = e => e.time ? (e.endTime ? `${e.time}~${e.endTime}` : e.time) : "";
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const safeUrl = u => { try { const x = new URL(String(u || "").trim()); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : ""; } catch { return ""; } };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
const normEmail = e => String(e || "").trim().toLowerCase();
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const me = () => (S.user ? S.user.email : "");
function status(p) {
  const s = D(p.start), e = D(p.end), t = today();
  if (!s || !e) return { key: "tbd", label: "기간 미정", note: "" };
  if (t < s) return { key: "soon", label: "예정", note: `시작까지 ${days(t, s)}일` };
  if (t > e) return { key: "done", label: "종료", note: "" };
  return { key: "live", label: "진행 중", note: `${days(t, e)}일 남음` };
}
const typesList = () => (Array.isArray(S.types) && S.types.length ? S.types : TYPES);
function typeColor(type) {
  const base = typesList(), extra = [...new Set(S.projects.map(p => p.type || "기타"))].filter(x => !base.includes(x)).sort();
  return `var(--t${(Math.max(0, [...base, ...extra].indexOf(type || "기타")) % 5) + 1})`;
}
function tileColor(label) { let n = 0; for (const ch of String(label)) n = (n * 31 + ch.codePointAt(0)) % 997; return `var(--t${n % 5 + 1})`; }
// 아이콘: 직접 지정한 이미지가 있으면 그것을, 없으면 연결된 사이트의 공식 아이콘(파비콘)을 쓴다. 불러오지 못하면 이름 첫 글자 타일이 그대로 남는다.
const iconSrc = v => { v = String(v || "").trim(); return /^https:\/\//i.test(v) ? safeUrl(v) : /^[\w\-./]+\.(png|svg|jpe?g|webp|ico|gif)$/i.test(v) && !v.includes("..") ? v : ""; };
function tile(label, url, icon) {
  const el = h("span", { class: "tile", style: `--c:${tileColor(label)}`, "aria-hidden": "true" }, [...String(label).trim()][0] || "·");
  const custom = iconSrc(icon), hst = host(url);
  const src = custom || (hst ? `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(hst)}` : "");
  if (src) { const img = new Image(); img.alt = "";
    img.onload = () => { if (custom || img.naturalWidth > 16) { el.replaceChildren(img); el.classList.add("has-img"); } };   // 16px짜리는 '아이콘 없음' 기본 그림이라 쓰지 않는다
    img.src = src; }
  return el;
}
const sortEvents = list => [...(list || [])].sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
const isAdminEmail = e => (ADMIN_EMAILS || []).map(normEmail).includes(e);
const whoName = (p, email) => !email ? "전체" : ((p.members || []).find(m => normEmail(m.email) === email) || {}).name || (isAdminEmail(email) ? "관리자" : email);
const isMine = t => !t.assignee || t.assignee === me();
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5000); }
async function save(what, fn) {
  try { await fn(); return true; }
  catch (e) { console.error(e); toast(e && e.code === "permission-denied" ? `${what}하지 못했습니다. 이 작업을 할 권한이 없습니다.` : `${what}하지 못했습니다. 연결 상태를 확인하고 다시 시도해 주세요.`); return false; }
}

/* ---------- 대화상자 ---------- */
function openDlg(node, narrow) { const d = $("#dlg"); d.className = narrow ? "narrow" : ""; d.replaceChildren(node); if (!d.open) d.showModal(); }

function ask(message, okLabel) {

    const d = $("#cfm");

        h("button", { class: "btn primary", type: "button", onclick: () => done(true) }, okLabel))));

function field(label, id, input) { input.id = id; return h("div", { class: "field" }, h("label", { for: id }, label), input); }
function dlgFoot(errEl, okLabel, onDelete) {

const busy = (form, on) => { const b = form.querySelector("[type=submit]"); if (b) b.disabled = on; };

/* ---------- 로그인 ---------- */
async function login() {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) {
    const c = e && e.code;
    if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return;
    toast(c === "auth/unauthorized-domain" ? "이 주소가 Firebase의 승인된 도메인에 없습니다. README의 3단계를 확인해 주세요."
      : c === "auth/popup-blocked" ? "브라우저가 로그인 창을 막았습니다. 팝업을 허용한 뒤 다시 눌러 주세요."
      : c === "auth/operation-not-allowed" ? "Firebase에서 Google 로그인이 켜져 있지 않습니다. README의 3단계를 확인해 주세요."
      : "로그인하지 못했습니다. 다시 시도해 주세요.");
  }
}

/* ---------- 실시간 자료 구독 ---------- */
function stopAll() { subs.base.forEach(u => u()); subs.base = []; Object.values(subs.per).forEach(a => a.forEach(u => u())); subs.per = {}; }
function onDenied(e) { console.error(e); if (e && e.code === "permission-denied") { S.denied = true; S.loaded.projects = true; render(); } }
function watchProjects() {
  const col = collection(db, "projects");
  const q = S.isAdmin ? col : query(col, where("memberEmails", "array-contains", me()));
  subs.base.push(onSnapshot(q, snap => {
    S.projects = snap.docs.map(d => ({ ...d.data(), id: d.id })); S.loaded.projects = true; S.denied = false;
    const ids = new Set(S.projects.map(p => p.id));
    for (const id of Object.keys(subs.per)) if (!ids.has(id)) { subs.per[id].forEach(u => u()); delete subs.per[id]; delete S.todos[id]; delete S.events[id]; }
    for (const id of ids) if (!subs.per[id]) subs.per[id] = ["todos", "events"].map(key =>
      onSnapshot(collection(db, "projects", id, key), s => { S[key][id] = s.docs.map(d => ({ ...d.data(), id: d.id })); render(); }, onDenied));
    // 참여 과제가 하나뿐이면 첫 화면을 건너뛰고 그 과제로 바로 이동
    if (!S.isAdmin && !S.redirected && S.projects.length === 1 && !/^#p-/.test(location.hash)) { S.redirected = true; location.hash = "p-" + S.projects[0].id; return; }
    S.redirected = true; render();
  }, onDenied));
  if (S.isAdmin) { const n = new Date();
    subs.base.push(onSnapshot(doc(db, "worktime", `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}`),
      s => { S.work = s.exists() ? s.data() : null; S.workState = "ok"; render(); }, () => { S.workState = "denied"; render(); })); }
  subs.base.push(onSnapshot(doc(db, "meta", "types"), s => { S.types = s.exists() ? s.data().list : null; render(); }, () => {}));
}
function watchLinks() {
  return onSnapshot(collection(db, "links"), snap => { S.links = snap.docs.map(d => ({ ...d.data(), id: d.id })); S.loaded.links = true; render(); }, e => { S.loaded.links = true; onDenied(e); });
}

/* ---------- 그리기 ---------- */
function render() {

function boot() {
